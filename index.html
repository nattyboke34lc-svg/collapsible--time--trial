<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102633"><title>COLLAPSIBLE TIME | THE LAST FLIGHT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102633;color:#f5f0e5;font-family:Georgia,serif}#stage{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}
#brand{position:fixed;z-index:2;top:18px;left:22px;font:900 10px/1.4 Arial,sans-serif;letter-spacing:.27em;color:#ead39d;text-shadow:0 2px 8px #10202a}#chapter{font:italic 12px Georgia,serif;letter-spacing:.04em;color:#f0e9dc;margin-top:4px}

#words{font:clamp(20px,3vw,34px)/1.3 Georgia,serif;color:#fff}

#titlecard p{font:italic clamp(14px,2vw,19px) Georgia,serif;color:#c8d4d0;letter-spacing:.04em}
