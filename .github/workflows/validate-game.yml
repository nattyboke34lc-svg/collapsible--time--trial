name: Validate Collapsible Time prototype
on:
  push:
    branches: [main, cinematic-world-rebuild]
    paths:
      - 'index.html'
      - 'game3d.js'
      - '.github/workflows/validate-game.yml'
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: node --input-type=module --check < game3d.js
      - name: Check page entry point
        run: grep -q 'src="./game3d.js"' index.html
