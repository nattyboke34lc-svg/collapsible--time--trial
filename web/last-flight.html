<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101d35">
<title>COLLAPSIBLE TIME: THE LAST FLIGHT</title>
<style>
:root{--ink:#101d35;--gold:#f2c879;--cream:#fff4df;--sky:#a8d8df}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d35;color:var(--cream);font-family:Georgia,'Times New Roman',serif;touch-action:manipulation}
#game{position:relative;width:100%;height:100%;min-height:420px;background:#101d35;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,36,.05),rgba(8,18,36,.12) 48%,rgba(8,18,36,.72));pointer-events:none}
#top{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:700 11px/1.2 system-ui;letter-spacing:.18em;color:#fff4df;text-shadow:0 2px 8px #102035}
#top span:last-child{color:var(--gold)}
#story{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 34px));text-align:center;padding:clamp(18px,4vw,38px);background:linear-gradient(145deg,rgba(12,27,48,.86),rgba(20,39,60,.70));border:1px solid rgba(242,200,121,.65);box-shadow:0 22px 80px #07101c88;backdrop-filter:blur(9px);border-radius:5px}
#eyebrow{font:700 10px system-ui;letter-spacing:.28em;color:var(--gold);margin-bottom:14px}
h1{font-size:clamp(31px,7vw,66px);line-height:.94;letter-spacing:-.045em;margin:0 0 16px;font-weight:500}
#copy{font-size:clamp(15px,2.5vw,20px);line-height:1.5;max-width:570px;margin:0 auto 22px;color:#f8eedc}
button{font:700 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:#14243a;background:linear-gradient(135deg,#ffe0a0,#d8a958);border:0;border-radius:3px;padding:15px 21px;min-height:48px;box-shadow:0 5px 0 #9a713d;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #9a713d}
button.secondary{color:#fff1d7;background:rgba(255,255,255,.10);border:1px solid #d8c59b;box-shadow:none}
#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;display:flex;justify-content:center;align-items:end;gap:10px;padding:0 14px;flex-wrap:wrap}
#controls button{min-width:112px}
#controls .wide{min-width:min(210px,48vw)}
#meterWrap{position:absolute;top:62px;left:18px;right:18px;height:4px;background:#ffffff38;display:none}
#meter{height:100%;width:0;background:#f2c879;transition:width .2s}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);left:0;right:0;text-align:center;color:#fff2d6;font:600 11px system-ui;letter-spacing:.1em;text-shadow:0 2px 6px #07101c}
#sound{position:absolute;right:16px;top:54px;background:#14243a99;border:1px solid #fff5;border-radius:50%;width:38px;height:38px;min-height:38px;padding:0;color:white;box-shadow:none}
.hidden{display:none!important}
#finalActions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
@media(max-height:560px){#story{top:46%;padding:14px 18px}#copy{margin-bottom:12px}#controls{bottom:10px}#hint{bottom:70px}h1{font-size:clamp(26px,5vw,42px)}}
</style></head>
<body><main id="game">
<canvas id="scene" aria-label="Interactive cinematic game scene"></canvas><div id="shade"></div>
<div id="top"><span>COLLAPSIBLE TIME</span><span id="chapter">CHAPTER 01 · THE LAST FLIGHT</span></div>
<button id="sound" aria-label="Toggle sound">♫</button><div id="meterWrap"><div id="meter"></div></div>
<section id="story"><div id="eyebrow">AN INTERACTIVE STORY</div><h1 id="title">THE LAST<br>FLIGHT</h1><p id="copy">The orders arrived before sunrise. The reason did not.<br><br>Tonight, you are flying with Mara.</p><button id="primary">ENTER THE AIRFIELD</button></section>
<div id="hint"></div><div id="controls" class="hidden"></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const story=document.getElementById('story'),title=document.getElementById('title'),copy=document.getElementById('copy'),eyebrow=document.getElementById('eyebrow'),primary=document.getElementById('primary'),controls=document.getElementById('controls'),hint=document.getElementById('hint'),meterWrap=document.getElementById('meterWrap'),meter=document.getElementById('meter'),chapter=document.getElementById('chapter'),soundBtn=document.getElementById('sound');
let W=0,H=0,dpr=1,stage='intro',t=0,flight=0,altitude=0,choice='',soundOn=false,audio=null,shake=0,collapse=0,stars=[];
const waitlist='https://form.jotform.com/263065632659060';
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8}))}
addEventListener('resize',resize);resize();
function tone(freq=180,dur=.18,type='sine',gain=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♫ ON':'♫';tone(440,.12)};
function panel(kicker,heading,body,button,fn){eyebrow.textContent=kicker;title.innerHTML=heading;copy.innerHTML=body;primary.textContent=button;primary.onclick=fn;story.classList.remove('hidden')}
function button(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;controls.appendChild(b);return b}
function showControls(...items){controls.innerHTML='';controls.classList.remove('hidden');items.forEach(x=>button(x[0],x[1],x[2]||''))}
function hideControls(){controls.classList.add('hidden');controls.innerHTML=''}
function begin(){stage='airfield';story.classList.add('hidden');chapter.textContent='KIJANI AIRFIELD · 07:10';panel('MISSION BRIEFING','ONE FLIGHT.<br>ONE SECRET.','Mara was not asked to volunteer. The aircraft is ready. The clinic is waiting beyond the storm line.','BOARD THE AIRCRAFT',board);tone(240,.4,'triangle')}
function board(){stage='boarding';chapter.textContent='AIRCRAFT 01 · BOARDING';panel('CABIN · BEFORE TAKEOFF','A SEAT BESIDE<br>THE UNKNOWN','The cabin is quiet. A photograph is tucked into the flight log: Mara, years younger, standing beside an aircraft she has never seen.','TAKE YOUR SEAT',taxi)}
function taxi(){stage='taxi';story.classList.add('hidden');chapter.textContent='RUNWAY 07 · ENGINE START';showControls(['START THE ENGINES',takeoff]);hint.textContent='THE RUNWAY IS CLEAR. THE SKY IS NOT.';tone(90,.7,'sawtooth',.025)}
function takeoff(){stage='takeoff';hideControls();chapter.textContent='TAKEOFF · CLIMB';hint.textContent='HOLD YOUR COURSE';tone(130,.8,'sawtooth',.05);setTimeout(()=>{if(stage!=='takeoff')return;stage='flight';flight=0;chapter.textContent='ABOVE THE CLOUDS · 8,000 FT';meterWrap.style.display='block';showControls(['CLIMB ▲',()=>{altitude=Math.min(3,altitude+1);tone(260,.12)}],['HOLD COURSE',()=>{flight=Math.min(100,flight+16);tone(320,.12)}],['DESCEND ▼',()=>{altitude=Math.max(-2,altitude-1);tone(190,.12)}]);hint.textContent='STEER THROUGH THE CLOUDS. FOLLOW THE DISTRESS SIGNAL.'},2200)}
function encounter(){stage='encounter';meterWrap.style.display='none';hideControls();chapter.textContent='UNIDENTIFIED TRANSMISSION';panel('RADIO · 02:17','“MARA. DO NOT<br>LOOK LEFT.”','A voice slips through the static. It sounds exactly like yours. Outside the cockpit, another aircraft is holding formation. Its cabin lights are on. Someone is waving.','ANSWER THE SIGNAL',decide);tone(65,.8,'sine',.06)}
function decide(){stage='choice';panel('THE SECOND AIRCRAFT','SAME FLIGHT NUMBER.<br>17 YEARS AHEAD.','Flight Control orders you to stay on course. The other Mara is still waving. The storm is folding inward. What do you do?','DIVERT TOWARD THE OTHER AIRCRAFT',()=>collapseStart('signal'));showControls(['KEEP THE ORIGINAL ROUTE',()=>collapseStart('route'),'DIVERT TOWARD THE SIGNAL',()=>collapseStart('signal')]);primary.classList.add('hidden')}
function collapseStart(which){choice=which;stage='collapse';hideControls();story.classList.add('hidden');chapter.textContent='TIMELINE INSTABILITY';collapse=0;shake=18;tone(48,1.4,'sawtooth',.08);hint.textContent='TIME HAS FOUND YOU.';setTimeout(()=>{if(stage==='collapse')wake()},5200)}
function wake(){stage='wake';chapter.textContent='UNKNOWN TIMELINE · UNKNOWN LIFE';tone(330,.35,'sine',.03);panel('SOMEWHERE ELSE · 06:42','YOU ARE NOT<br>ON THAT PLANE.','Mara opens her eyes beneath an unfamiliar sky. The hands are hers, but the memories are not. A stranger nearby whispers: “You are late. They have been waiting for you.”<br><br>You were not watching the story. You crossed into it.','WAKE UP',reveal)}
function reveal(){stage='final';chapter.textContent='COLLAPSIBLE TIME · YOUR STORY BEGINS';panel('THE QUESTION IS YOURS NOW','WOULD YOU SURVIVE<br>IN MY TIMELINE?','Every life is a world. Every choice leaves a trace. This was only the first crossing.<br><br>Join the first players shaping <em>Collapsible Time</em>. Then send the invitation to someone who would survive a different timeline.','JOIN THE WAITLIST',join);showControls(['SHARE THE EXPERIENCE',share,'secondary'],['PLAY AGAIN',()=>location.reload(),'secondary']);primary.classList.remove('hidden')}
function join(){window.open(waitlist,'_blank','noopener');tone(520,.2)}
async function share(){const data={title:'Collapsible Time: The Last Flight',text:'I just crossed the first timeline. Would you survive in my timeline? Join the early player waitlist:',url:waitlist};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(data.text+' '+data.url);hint.textContent='INVITATION COPIED. SEND IT TO YOUR CREW.'}else{window.prompt('Copy this invitation:',data.text+' '+data.url)}}catch(e){}}
primary.onclick=begin;
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function cloud(x,y,s=1,a=.7){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#f6f1e5';ctx.beginPath();ctx.ellipse(x,y,55*s,16*s,0,0,Math.PI*2);ctx.ellipse(x-25*s,y-8*s,28*s,20*s,0,0,Math.PI*2);ctx.ellipse(x+16*s,y-14*s,36*s,25*s,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function person(x,y,s=1,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(s,s);ctx.fillStyle='#18283d';ctx.beginPath();ctx.ellipse(0,0,17,5,0,0,Math.PI*2);ctx.fill();poly([[-12,-58],[10,-60],[15,-18],[-12,-18]],'#527e91','#d9c8a4',2);poly([[-10,-18],[-1,-18],[-4,0],[-13,0]],'#26364b');poly([[2,-18],[12,-18],[17,0],[8,0]],'#26364b');ctx.fillStyle='#d8a27d';ctx.beginPath();ctx.arc(0,-73,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263344';ctx.beginPath();ctx.arc(-1,-78,14,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#f4d6b1';ctx.fillRect(-5,-74,2,2);ctx.restore()}
function plane(x,y,s=1,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.shadowColor='#14263d88';ctx.shadowBlur=18;poly([[-90,0],[-25,-10],[38,-7],[88,0],[38,9],[-25,10]],'#e7e4dc','#526879',2);poly([[-25,-7],[-8,-55],[9,-55],[18,-7]],'#c5d4d4','#647b88',2);poly([[-18,5],[-4,45],[9,45],[13,6]],'#b4c5c5','#647b88',2);poly([[47,-4],[76,-24],[83,-23],[70,-2]],'#d4d6d1');ctx.fillStyle='#526879';ctx.fillRect(-66,-3,22,6);ctx.restore()}
function drawAirfield(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9bcbd1');g.addColorStop(.62,'#e4c6a2');g.addColorStop(1,'#637f7c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);poly([[0,H*.68],[W*.2,H*.48],[W*.42,H*.65],[W*.7,H*.45],[W,H*.62],[W,H],[0,H]],'#667e75');ctx.fillStyle='#354d55';ctx.fillRect(0,H*.76,W,H*.24);ctx.fillStyle='#e8d5b0';ctx.fillRect(0,H*.77,W,4);for(let i=0;i<12;i++){ctx.fillRect((i*W/7+t*12)%W,H*.88,25,4)}ctx.fillStyle='#d6c8ad';ctx.fillRect(W*.12,H*.48,W*.3,H*.2);poly([[W*.1,H*.48],[W*.26,H*.31],[W*.45,H*.48]],'#aeb8b0');ctx.fillStyle='#304b5c';ctx.fillRect(W*.22,H*.53,W*.16,H*.15);for(let i=0;i<5;i++){ctx.fillStyle='#d3c8b0';ctx.fillRect(W*.235+i*W*.029,H*.54,W*.012,H*.14)}cloud(W*.7,H*.2,.8,.65);person(W*.52,H*.78,1.25)}
function drawCabin(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#182f4c');g.addColorStop(1,'#b27d60');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d7c6a5';ctx.fillRect(W*.08,H*.13,W*.84,H*.58);ctx.fillStyle='#274d65';ctx.fillRect(W*.12,H*.17,W*.76,H*.48);let gg=ctx.createLinearGradient(0,H*.17,0,H*.65);gg.addColorStop(0,'#91c6d0');gg.addColorStop(1,'#e2a87f');ctx.fillStyle=gg;ctx.fillRect(W*.13,H*.18,W*.74,H*.46);poly([[0,H*.75],[W,H*.75],[W,H],[0,H]],'#24384b');for(let i=0;i<5;i++){ctx.fillStyle='#d9c7a5';ctx.fillRect(W*(.13+i*.16),H*.73,W*.12,H*.05)}person(W*.43,H*.83,1.45);ctx.fillStyle='#f5d6a0';ctx.font='italic '+Math.max(13,W*.018)+'px Georgia';ctx.fillText('FLIGHT LOG  /  MARA',W*.58,H*.86)}
function drawFlight(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#173b63');g.addColorStop(.5,'#79aeb9');g.addColorStop(1,'#e9c6a0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<12;i++){let x=((i*177-t*55)% (W+200)+W+200)%(W+200)-100;cloud(x,H*(.35+(i%4)*.13),.8+(i%3)*.35,.55)}poly([[0,H*.82],[W*.2,H*.7],[W*.42,H*.81],[W*.7,H*.67],[W,H*.78],[W,H],[0,H]],'#617e82');plane(W*.5,H*.54,Math.min(W/900,1.15),Math.sin(t*.6)*.025);if(stage==='encounter'||stage==='choice'){plane(W*.78,H*.4,.68,-.04);ctx.fillStyle='#f6d08a';ctx.beginPath();ctx.arc(W*.78,H*.4,5,0,7);ctx.fill()}if(stage==='flight'){ctx.fillStyle='#fff1d5';ctx.font='12px system-ui';ctx.fillText('ALTITUDE  '+(8000+altitude*450)+' FT',22,100)}}
function drawCollapse(){ctx.fillStyle='#10162b';ctx.fillRect(0,0,W,H);for(let i=0;i<stars.length;i++){let s=stars[i];ctx.fillStyle='rgba(220,235,255,'+(.3+s.z*.7)+')';ctx.fillRect(s.x,s.y,1+s.z*2,1+s.z*2)}let cx=W/2,cy=H/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.4);for(let i=0;i<18;i++){let a=i*Math.PI/9;ctx.strokeStyle=i%2?'#86cbd0':'#f0c47b';ctx.globalAlpha=.3+Math.sin(t*7+i)*.25;ctx.lineWidth=i%3===0?3:1;ctx.beginPath();ctx.moveTo(Math.cos(a)*35,Math.sin(a)*35);ctx.lineTo(Math.cos(a)*(W*.8),Math.sin(a)*(H*.8));ctx.stroke()}ctx.globalAlpha=1;ctx.strokeStyle='#f4d49b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,55+Math.sin(t*8)*18,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(t*3)*.4);ctx.scale(.9+Math.sin(t*5)*.2,.9+Math.sin(t*5)*.2);plane(0,0,1.15,Math.sin(t*4)*.2);ctx.restore();if(t%1<.08){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}}
function drawWake(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b7d9d5');g.addColorStop(.55,'#f0d3ad');g.addColorStop(1,'#718b80');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<6;i++){cloud(W*(i/5)-30,H*(.22+(i%2)*.13),1.1,.6)}poly([[0,H*.75],[W*.18,H*.58],[W*.38,H*.7],[W*.62,H*.55],[W,H*.72],[W,H],[0,H]],'#59756e');ctx.fillStyle='#334e4c';ctx.fillRect(0,H*.85,W,H*.15);person(W*.5,H*.81,1.7,-.08);ctx.fillStyle='#f9eedb';ctx.font='italic '+Math.max(16,W*.025)+'px Georgia';ctx.textAlign='center';ctx.fillText('A DIFFERENT MORNING.',W/2,H*.18);ctx.textAlign='left'}
function frame(){requestAnimationFrame(frame);t+=.016;ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.92;if(shake<.3)shake=0}
if(stage==='intro'||stage==='airfield'||stage==='taxi'||stage==='takeoff')drawAirfield();
if(stage==='boarding')drawCabin();
if(stage==='flight'||stage==='encounter'||stage==='choice')drawFlight();
if(stage==='collapse')drawCollapse();
if(stage==='wake'||stage==='final')drawWake();
if(stage==='takeoff'){ctx.fillStyle='rgba(255,255,255,'+Math.min(.45,(t%2)*.22)+')';ctx.fillRect(0,0,W,H)}
if(stage==='flight'){flight=Math.min(100,flight+.045);meter.style.width=flight+'%';if(flight>=100)encounter()}
if(stage==='collapse'){let vign=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H)*.8);vign.addColorStop(0,'transparent');vign.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H)}
ctx.restore()}
frame();
})();
</script></body></html>
